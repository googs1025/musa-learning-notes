<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MUSA Learning Quiz</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #637083;
      --line: #dce2ea;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --warn: #b45309;
      --bad: #b91c1c;
      --good: #15803d;
      --shadow: 0 10px 28px rgba(23, 32, 42, 0.08);
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
    }

    button, select, input, textarea {
      font: inherit;
    }

    button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    button:hover { border-color: #aab7c7; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #101820;
      color: #f8fafc;
      padding: 24px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .chip-diagram {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 4px 0 0;
      color: #b8c3d1;
      font-size: 13px;
      line-height: 1.4;
    }

    .control-group {
      margin: 18px 0;
    }

    .control-group label {
      display: block;
      margin-bottom: 8px;
      color: #c8d2df;
      font-size: 13px;
      font-weight: 600;
    }

    select, input[type="search"] {
      width: 100%;
      min-height: 40px;
      border: 1px solid #344256;
      border-radius: 8px;
      padding: 8px 10px;
      color: #f8fafc;
      background: #182332;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mode-grid button {
      background: #182332;
      color: #dbeafe;
      border-color: #344256;
    }

    .mode-grid button.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 20px;
    }

    .stat {
      padding: 12px;
      border: 1px solid #344256;
      border-radius: 8px;
      background: #182332;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: #b8c3d1;
      font-size: 12px;
    }

    .main {
      padding: 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .progress-wrap {
      min-width: 220px;
      max-width: 340px;
      flex: 1;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: #e5eaf1;
      overflow: hidden;
    }

    .progress div {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 160ms ease;
    }

    .question-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .question-panel {
      min-height: 520px;
      padding: 24px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 8px;
      border-radius: 999px;
      color: #233044;
      background: #eef2f7;
      font-size: 12px;
      font-weight: 650;
    }

    .pill.good { color: var(--good); background: #dcfce7; }
    .pill.warn { color: var(--warn); background: #fef3c7; }
    .pill.bad { color: var(--bad); background: #fee2e2; }

    .question-text {
      margin: 0 0 18px;
      font-size: 24px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .choices {
      display: grid;
      gap: 10px;
      margin: 18px 0;
    }

    .choice {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      text-align: left;
      line-height: 1.45;
      background: #fff;
    }

    .choice.selected {
      border-color: var(--accent);
      outline: 2px solid rgba(15, 118, 110, 0.15);
    }

    .choice.correct { border-color: var(--good); background: #f0fdf4; }
    .choice.wrong { border-color: var(--bad); background: #fef2f2; }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      resize: vertical;
      line-height: 1.5;
      background: #fff;
      color: var(--ink);
    }

    .answer {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      line-height: 1.65;
    }

    .answer.show { display: block; }

    .answer h3 {
      margin: 0 0 8px;
      font-size: 15px;
      letter-spacing: 0;
    }

    .answer p {
      margin: 8px 0;
    }

    code {
      padding: 1px 5px;
      border-radius: 5px;
      background: #e8eef6;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .primary:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    .danger {
      color: var(--bad);
      border-color: #fecaca;
      background: #fff7f7;
    }

    .side-panel {
      padding: 18px;
    }

    .side-panel h3 {
      margin: 0 0 12px;
      font-size: 15px;
      letter-spacing: 0;
    }

    .list {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow: auto;
      padding-right: 4px;
    }

    .question-link {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 20px;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      text-align: left;
      border-radius: 8px;
      background: #fff;
    }

    .question-link.active {
      border-color: var(--accent);
      background: #ecfdf5;
    }

    .question-link small {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--muted);
    }

    .mark {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #cbd5e1;
    }

    .mark.done { background: var(--good); }
    .mark.review { background: var(--warn); }
    .mark.wrong { background: var(--bad); }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .footer-note {
      margin-top: 18px;
      color: #b8c3d1;
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
      }
      .question-layout { grid-template-columns: 1fr; }
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }
      .progress-wrap {
        max-width: none;
      }
    }

    @media (max-width: 560px) {
      .main { padding: 16px; }
      .question-panel { padding: 18px; min-height: auto; }
      .question-text { font-size: 20px; }
      .actions { display: grid; grid-template-columns: 1fr; }
      .mode-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="chip-diagram" viewBox="0 0 64 64" role="img" aria-label="GPU tile diagram">
          <rect x="10" y="10" width="44" height="44" rx="6" fill="#0f766e"></rect>
          <rect x="18" y="18" width="10" height="10" fill="#d9f99d"></rect>
          <rect x="36" y="18" width="10" height="10" fill="#bae6fd"></rect>
          <rect x="18" y="36" width="10" height="10" fill="#fde68a"></rect>
          <rect x="36" y="36" width="10" height="10" fill="#fecaca"></rect>
          <path d="M4 20h6M4 32h6M4 44h6M54 20h6M54 32h6M54 44h6M20 4v6M32 4v6M44 4v6M20 54v6M32 54v6M44 54v6" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"></path>
        </svg>
        <div>
          <h1>MUSA Quiz</h1>
          <p class="subtitle">项目级学习检测</p>
        </div>
      </div>

      <div class="control-group">
        <label for="deckSelect">题库</label>
        <select id="deckSelect"></select>
      </div>

      <div class="control-group">
        <label>模式</label>
        <div class="mode-grid">
          <button id="modeAll" class="active" type="button">全部</button>
          <button id="modeReview" type="button">复习</button>
          <button id="modeWrong" type="button">错题</button>
          <button id="modeShuffle" type="button">随机</button>
        </div>
      </div>

      <div class="control-group">
        <label for="searchInput">搜索</label>
        <input id="searchInput" type="search" placeholder="kernel / softmax / stream">
      </div>

      <div class="stats">
        <div class="stat"><strong id="statDone">0</strong><span>已完成</span></div>
        <div class="stat"><strong id="statReview">0</strong><span>待复习</span></div>
        <div class="stat"><strong id="statWrong">0</strong><span>错题</span></div>
        <div class="stat"><strong id="statTotal">0</strong><span>当前题数</span></div>
      </div>

    </aside>

    <main class="main">
      <div class="topbar">
        <h2 id="deckTitle">学习检测</h2>
        <div class="progress-wrap">
          <div class="progress-label">
            <span id="progressText">0 / 0</span>
            <span id="progressPct">0%</span>
          </div>
          <div class="progress"><div id="progressBar"></div></div>
        </div>
      </div>

      <div class="question-layout">
        <section class="panel question-panel" id="questionPanel"></section>
        <aside class="panel side-panel">
          <h3>题目列表</h3>
          <div class="list" id="questionList"></div>
        </aside>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "musa-learning-quiz-v1";

    const QUESTIONS = [
      {
        id: "w1-q1",
        deck: "Week 1",
        type: "choice",
        level: "基础",
        source: "code/week1/concept-review.md",
        question: "`kernel<<<grid, block>>>` 里的 `grid` 和 `block` 分别控制什么？",

          "grid 控制 block 数量，block 控制每个 block 的 thread 数量",

          "它们只影响编译，不影响运行"
        ],
        answerIndex: 0,
        answer: "`grid` 决定启动多少个 block，`block` 决定每个 block 里有多少个 thread。",
        pitfall: "`<<<2, 4>>>` 是 2 个 block、每个 block 4 个线程，总共 8 个线程。"
      },
      {
        id: "w1-q2",
        deck: "Week 1",
        type: "choice",
        level: "基础",
        source: "code/week1/concept-review.md",
        question: "一维全局线程索引的标准写法是什么？",
        choices: [
          "`blockIdx.x * blockDim.x + threadIdx.x`",
          "`threadIdx.x * gridDim.x + blockIdx.x`",
          "`blockIdx.x + threadIdx.x`",
          "`gridDim.x * blockDim.x`"
        ],
        answerIndex: 0,
        answer: "`int idx = blockIdx.x * blockDim.x + threadIdx.x;`",
        pitfall: "只用 `threadIdx.x` 会让不同 block 的线程写同一批位置。"

      {

        type: "choice",
        level: "基础",
        source: "code/week1/concept-review.md",
        question: "为什么常见 kernel 都要写 `if (idx < N)`？",
        choices: [
          "因为 block 数向上取整后，最后一个 block 可能有多余线程",
          "因为 GPU 不支持数组越界检查",
          "因为所有线程必须只执行一次",
          "因为 `idx` 默认可能是负数"

        answerIndex: 0,
        answer: "`blocks = (N + threads - 1) / threads` 保证线程数不少于 N，但不保证刚好等于 N。",

        answerIndex: 0,
        answer: "不能。block 和 thread 的调度顺序由硬件决定，输出可能交错。",
        pitfall: "验证逻辑要看索引值和计算结果，不要依赖打印顺序。"
      },
      {
        id: "w1-q5",
        deck: "Week 1",
        type: "choice",
        level: "基础",
        source: "code/week1/concept-review.md",
        question: "host 代码能直接用 `d_ptr[0]` 读取 device pointer 的内容吗？",

        answer: "device pointer 指向 GPU 显存，host 不能把它当普通数组解引用。",

      {

        deck: "Week 1",
        type: "choice",
        level: "基础",
        source: "code/week1/concept-review.md",
        question: "`musaMemset(d, 1, bytes)` 能把 float 数组设成 `1.0f` 吗？",
        choices: ["不能，它按字节填充", "能，它按 float 元素填充", "只在 aligned 内存上能", "只对第一个元素有效"],
        answerIndex: 0,
        answer: "`musaMemset` 是按字节填充，不是按元素赋值。",
        pitfall: "`1.0f` 的二进制不是每个字节都等于 `0x01`。"
      },
      {
        id: "w1-q7",

        type: "short",
        level: "基础",

        type: "choice",
        level: "基础",

        question: "kernel launch 为什么说是异步的？",

      {

        pitfall: "可 debug 不等于高性能，`S x S` 中间矩阵会很快吃掉显存和带宽。"
      },
      {
        id: "case-q9",
        deck: "Attention Case",
        type: "choice",
        level: "核心",
        source: "code/case/05_flash_attention_mini.mu",
        question: "Mini FlashAttention 教学版为什么让一个线程处理一个 query row？",
        choices: [
          "为了让 online softmax 的数学状态和更新公式更清楚",
          "因为真实实现也必须这么写",
          "因为这样一定最快",
          "因为不能使用 block"
        ],
        answerIndex: 0,
        answer: "教学版牺牲并行度，换取 `m/l/acc` 状态更新一眼能对上公式。",
        pitfall: "性能版会把 tile 内 dot 和累加分给更多线程，但数学递推不变。"
      }
    ];

    const decks = ["全部", ...Array.from(new Set(QUESTIONS.map(q => q.deck)))];
    let state = loadState();
    let mode = "all";
    let currentIndex = 0;
    let filtered = [];
    let answerVisible = false;
    let selectedChoice = null;

    const deckSelect = document.getElementById("deckSelect");
    const searchInput = document.getElementById("searchInput");
    const questionPanel = document.getElementById("questionPanel");
    const questionList = document.getElementById("questionList");
    const deckTitle = document.getElementById("deckTitle");
    const progressText = document.getElementById("progressText");
    const progressPct = document.getElementById("progressPct");
    const progressBar = document.getElementById("progressBar");
    const statDone = document.getElementById("statDone");
    const statReview = document.getElementById("statReview");
    const statWrong = document.getElementById("statWrong");
    const statTotal = document.getElementById("statTotal");

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function questionState(id) {
      if (!state[id]) state[id] = { status: "new", attempts: 0 };
      return state[id];
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function inlineCode(value) {
      return escapeHtml(value).replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    function setupDecks() {
      deckSelect.innerHTML = decks.map(deck => `<option value="${escapeHtml(deck)}">${escapeHtml(deck)}</option>`).join("");
    }

    function setMode(nextMode) {
      mode = nextMode;
      document.querySelectorAll(".mode-grid button").forEach(btn => btn.classList.remove("active"));
      document.getElementById(`mode${nextMode[0].toUpperCase()}${nextMode.slice(1)}`).classList.add("active");
      currentIndex = 0;
      applyFilters();
    }

    function applyFilters() {
      const deck = deckSelect.value;
      const term = searchInput.value.trim().toLowerCase();
      filtered = QUESTIONS.filter(q => {
        const s = questionState(q.id);
        const deckOk = deck === "全部" || q.deck === deck;
        const text = `${q.question} ${q.answer} ${q.pitfall} ${q.source} ${q.deck}`.toLowerCase();
        const searchOk = !term || text.includes(term);
        const modeOk =
          mode === "all" ||
          mode === "shuffle" ||
          (mode === "review" && s.status === "review") ||
          (mode === "wrong" && s.status === "wrong");
        return deckOk && searchOk && modeOk;
      });

      if (mode === "shuffle") {
        filtered = [...filtered].sort(() => Math.random() - 0.5);
      }

      currentIndex = Math.min(currentIndex, Math.max(filtered.length - 1, 0));
      answerVisible = false;
      selectedChoice = null;
      render();
    }

    function render() {
      renderStats();
      renderQuestion();
      renderList();
    }

    function renderStats() {
      const visibleDone = filtered.filter(q => questionState(q.id).status === "done").length;
      const allReview = QUESTIONS.filter(q => questionState(q.id).status === "review").length;
      const allWrong = QUESTIONS.filter(q => questionState(q.id).status === "wrong").length;
      const total = filtered.length;
      const pct = total ? Math.round((visibleDone / total) * 100) : 0;

      deckTitle.textContent = `${deckSelect.value} · ${modeLabel(mode)}`;
      progressText.textContent = `${visibleDone} / ${total}`;
      progressPct.textContent = `${pct}%`;
      progressBar.style.width = `${pct}%`;
      statDone.textContent = String(visibleDone);
      statReview.textContent = String(allReview);
      statWrong.textContent = String(allWrong);
      statTotal.textContent = String(total);
    }

    function modeLabel(value) {
      return ({ all: "全部", review: "复习", wrong: "错题", shuffle: "随机" })[value];
    }

    function statusLabel(status) {
      return ({ new: "未答", done: "会了", review: "复习", wrong: "错题" })[status] || "未答";
    }

    function statusClass(status) {
      return ({ done: "good", review: "warn", wrong: "bad" })[status] || "";
    }

    function renderQuestion() {
      if (!filtered.length) {
        questionPanel.innerHTML = `<div class="empty">当前筛选没有题目。</div>`;
        return;
      }

      const q = filtered[currentIndex];
      const s = questionState(q.id);
      const choiceHtml = q.type === "choice" ? `
        <div class="choices">
          ${q.choices.map((choice, idx) => {
            let klass = "choice";
            if (selectedChoice === idx) klass += " selected";
            if (answerVisible && idx === q.answerIndex) klass += " correct";
            if (answerVisible && selectedChoice === idx && idx !== q.answerIndex) klass += " wrong";
            return `<button class="${klass}" type="button" data-choice="${idx}">${inlineCode(choice)}</button>`;
          }).join("")}
        </div>
      ` : `
        <textarea id="shortAnswer" placeholder="先写下自己的答案，再展开参考答案。"></textarea>
      `;

      questionPanel.innerHTML = `
        <div class="meta-row">
          <span class="pill">${escapeHtml(q.deck)}</span>
          <span class="pill">${escapeHtml(q.level)}</span>
          <span class="pill ${statusClass(s.status)}">${statusLabel(s.status)}</span>
          <span class="pill">${currentIndex + 1} / ${filtered.length}</span>
        </div>
        <h2 class="question-text">${inlineCode(q.question)}</h2>
        ${choiceHtml}
        <div class="answer ${answerVisible ? "show" : ""}">
          <h3>参考答案</h3>
          <p>${inlineCode(q.answer)}</p>
          <h3>易错点</h3>
          <p>${inlineCode(q.pitfall)}</p>
          <p><strong>来源:</strong> <code>${escapeHtml(q.source)}</code></p>
        </div>
        <div class="actions">
          <button class="primary" type="button" id="toggleAnswer">${answerVisible ? "隐藏答案" : "显示答案"}</button>
          <button type="button" id="markDone">会了</button>
          <button type="button" id="markReview">标记复习</button>
          <button type="button" id="markWrong">不会</button>
          <button type="button" id="prevQuestion">上一题</button>
          <button type="button" id="nextQuestion">下一题</button>
        </div>
      `;

      questionPanel.querySelectorAll("[data-choice]").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedChoice = Number(btn.dataset.choice);
          if (q.type === "choice") answerVisible = true;
          const qs = questionState(q.id);
          qs.attempts += 1;
          qs.status = selectedChoice === q.answerIndex ? "done" : "wrong";
          saveState();
          render();
        });
      });

      document.getElementById("toggleAnswer").addEventListener("click", () => {
        answerVisible = !answerVisible;
        renderQuestion();
      });
      document.getElementById("markDone").addEventListener("click", () => mark("done"));
      document.getElementById("markReview").addEventListener("click", () => mark("review"));
      document.getElementById("markWrong").addEventListener("click", () => mark("wrong"));
      document.getElementById("prevQuestion").addEventListener("click", prevQuestion);
      document.getElementById("nextQuestion").addEventListener("click", nextQuestion);
    }

    function renderList() {
      if (!filtered.length) {
        questionList.innerHTML = "";
        return;
      }

      questionList.innerHTML = filtered.map((q, idx) => {
        const s = questionState(q.id);
        const active = idx === currentIndex ? " active" : "";
        return `
          <button class="question-link${active}" type="button" data-go="${idx}">
            <strong>${escapeHtml(q.id.toUpperCase().replace("-", " "))}</strong>
            <small>${escapeHtml(q.question.replaceAll("`", ""))}</small>
            <span class="mark ${escapeHtml(s.status)}"></span>
          </button>
        `;
      }).join("");

      questionList.querySelectorAll("[data-go]").forEach(btn => {
        btn.addEventListener("click", () => {
          currentIndex = Number(btn.dataset.go);
          answerVisible = false;
          selectedChoice = null;
          render();
        });
      });
    }

    function mark(status) {
      if (!filtered.length) return;
      const q = filtered[currentIndex];
      const s = questionState(q.id);
      s.status = status;
      s.attempts += 1;
      saveState();
      render();
    }

    function nextQuestion() {
      if (!filtered.length) return;
      currentIndex = (currentIndex + 1) % filtered.length;
      answerVisible = false;
      selectedChoice = null;
      render();
    }

    function prevQuestion() {
      if (!filtered.length) return;
      currentIndex = (currentIndex - 1 + filtered.length) % filtered.length;
      answerVisible = false;
      selectedChoice = null;
      render();
    }

    function resetProgress() {
      if (!confirm("确认清空本浏览器里的答题记录？")) return;
      state = {};
      saveState();
      applyFilters();
    }

    setupDecks();
    document.getElementById("modeAll").addEventListener("click", () => setMode("all"));
    document.getElementById("modeReview").addEventListener("click", () => setMode("review"));
    document.getElementById("modeWrong").addEventListener("click", () => setMode("wrong"));
    document.getElementById("modeShuffle").addEventListener("click", () => setMode("shuffle"));
    deckSelect.addEventListener("change", applyFilters);
    searchInput.addEventListener("input", applyFilters);

    const resetButton = document.createElement("button");
    resetButton.className = "danger";
    resetButton.type = "button";
    resetButton.textContent = "重置进度";
    resetButton.addEventListener("click", resetProgress);
    document.querySelector(".sidebar").appendChild(resetButton);

    applyFilters();
  </script>
</body>
</html>
